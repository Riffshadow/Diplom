[bastion]
bastion ansible_host=diplom-bastion.ru-central1.internal

[web]
web-1 ansible_host=diplom-web-1.ru-central1.internal
web-2 ansible_host=diplom-web-2.ru-central1.internal

[zabbix]
zabbix ansible_host=diplom-zabbix.ru-central1.internal

[elasticsearch]
elasticsearch ansible_host=diplom-elasticsearch.ru-central1.internal

[kibana]
kibana ansible_host=diplom-kibana.ru-central1.internal

[private:children]
web
zabbix
elasticsearch
kibana

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/home/ivan/.ssh/diplom_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[private:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ProxyCommand="ssh -i /home/ivan/.ssh/diplom_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -W %h:%p ubuntu@diplom-bastion.ru-central1.internal"'
