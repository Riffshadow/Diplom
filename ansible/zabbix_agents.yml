---
- name: Install Zabbix Agent2 on web servers
  hosts: web
  become: true

  vars:
    zabbix_repo_url: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb"

  tasks:
    - name: Download Zabbix repository package
      ansible.builtin.get_url:
        url: "{{ zabbix_repo_url }}"
        dest: /tmp/zabbix-release.deb
        mode: "0644"

    - name: Install Zabbix repository
      ansible.builtin.apt:
        deb: /tmp/zabbix-release.deb

    - name: Install Zabbix Agent2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
        update_cache: true

    - name: Configure active Zabbix server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?ServerActive='
        line: 'ServerActive=10.10.1.20'

    - name: Configure hostname
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?Hostname='
        line: 'Hostname={{ inventory_hostname }}'

    - name: Enable and restart Zabbix Agent2
      ansible.builtin.service:
        name: zabbix-agent2
        enabled: true
        state: restarted
