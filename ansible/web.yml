---
- name: Configure identical nginx web servers
  hosts: web
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 180

    - name: Copy static website
      ansible.builtin.copy:
        src: files/site/
        dest: /var/www/html/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

    - name: Check local HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: true
      register: website_check
      failed_when: >-
        website_check.status != 200 or
        'Чернобровкин Иван' not in website_check.content
