---
- name: Run Elasticsearch 7.17.9 in Docker
  hosts: elasticsearch
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Set vm.max_map_count for Elasticsearch
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        sysctl_set: true
        reload: true

    - name: Pull Elasticsearch image
      ansible.builtin.command:
        cmd: docker pull docker.elastic.co/elasticsearch/elasticsearch:7.17.9
      register: elastic_pull
      changed_when: "'Downloaded newer image' in elastic_pull.stdout"

    - name: Create Elasticsearch data volume
      ansible.builtin.command:
        cmd: docker volume create elasticsearch-data
      register: elastic_volume
      changed_when: elastic_volume.stdout.strip() == "elasticsearch-data"

    - name: Remove old Elasticsearch container if present
      ansible.builtin.shell: |
        if docker ps -a --format '{% raw %}{{.Names}}{% endraw %}' | grep -qx elasticsearch; then
          docker rm -f elasticsearch
        fi
      register: remove_elastic
      changed_when: remove_elastic.stdout != ""

    - name: Start Elasticsearch container
      ansible.builtin.command:
        cmd: >
          docker run -d
          --name elasticsearch
          --restart unless-stopped
          -p 9200:9200
          -v elasticsearch-data:/usr/share/elasticsearch/data
          -e discovery.type=single-node
          -e xpack.security.enabled=false
          -e cluster.name=diplom-logs
          -e node.name=diplom-elasticsearch
          -e "ES_JAVA_OPTS=-Xms1g -Xmx1g"
          docker.elastic.co/elasticsearch/elasticsearch:7.17.9

    - name: Wait for Elasticsearch
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9200
        timeout: 180

    - name: Check Elasticsearch API
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/
        status_code: 200
        return_content: true
      register: elastic_check

    - name: Show Elasticsearch response
      ansible.builtin.debug:
        var: elastic_check.json
